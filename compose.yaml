services:
    mysql:
        image: mysql:8.4
        container_name: randzdev-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: randzdev
            MYSQL_USER: randzdev
            MYSQL_PASSWORD: randzdev
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - randzdev_mysql_data:/var/lib/mysql
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-h"
                - "localhost"
                - "-u"
                - "root"
                - "-proot"
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    randzdev_mysql_data:
